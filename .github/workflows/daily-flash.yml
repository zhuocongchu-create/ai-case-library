name: daily-aihot-flash

# 每天北京时间 08:30（= UTC 00:30）同步 AIHOT 快讯并自动部署
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "45 0 * * *"  # 备用闹钟：防 GitHub 定时跳过（并发组保证不重复干活）
  workflow_dispatch: {}   # 手动触发按钮，方便测试

permissions:
  contents: write

concurrency:
  group: daily-flash
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AIHOT flash
        id: fetch
        run: |
          python scripts/fetch_aihot.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Generate monetization news (AI commentary)
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python scripts/generate_news.py

      # 数据没变化时跳过提交，避免空 commit 触发无意义部署
      - name: Check diff
        id: diff
        run: |
          if git diff --quiet -- site/aihot-flash.js site/news-data.js site/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump cache version
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/bump_version.py

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "aihot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/
          git commit -m "daily: aihot flash $(date -u +%F) [skip ci]"
          git push
