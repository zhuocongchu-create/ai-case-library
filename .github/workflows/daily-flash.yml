name: daily-aihot-flash

# 目标：每天北京时间 08:30 更新（= UTC 00:30）
# ⚠️ GitHub 的定时队列是「尽力而为」：高峰时可能延迟数小时甚至丢单（实测曾延迟 4.5 小时），
#    因此这里铺 5 个时间点提高命中率；脚本按标题去重 + 无变化不提交，多跑无副作用。
on:
  schedule:
    - cron: "30 0 * * *"   # 北京 08:30（主闹钟）
    - cron: "45 0 * * *"   # 北京 08:45（备用）
    - cron: "15 1 * * *"   # 北京 09:15（补刀）
    - cron: "30 2 * * *"   # 北京 10:30（兜底 1）
    - cron: "30 3 * * *"   # 北京 11:30（兜底 2）
  workflow_dispatch: {}   # 手动触发按钮，方便测试

permissions:
  contents: write

concurrency:
  group: daily-flash
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AIHOT flash
        id: fetch
        run: |
          python scripts/fetch_aihot.py
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Generate monetization news (AI commentary)
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python scripts/generate_news.py

      # 数据没变化时跳过提交，避免空 commit 触发无意义部署
      - name: Check diff
        id: diff
        run: |
          if git diff --quiet -- site/aihot-flash.js site/news-data.js site/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump cache version
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/bump_version.py

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "aihot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/
          git commit -m "daily: aihot flash $(date -u +%F) [skip ci]"
          git push

      # ↓ 新增：同步到飞书知识库的两个固定页（整页覆写，只保留近 3 天）
      #   凭证 = 仓库 Secrets：FEISHU_APP_ID / FEISHU_APP_SECRET（若换成其他应用，改这两个 Secret 即可，代码不用动）
      #   未配置凭证时脚本自行跳过（exit 0）；失败不阻塞主流程（continue-on-error）
      #   ⚠️ 该知识库 无新建/删除节点权限（131006），脚本只覆写既有页面，不会建/删节点
      #   ⚠️ 不设 if 条件 = 每次运行都同步：即使当天数据没变化，也必须重写一次才能把超期条目裁掉
      - name: Sync to Feishu wiki
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python scripts/sync_wiki.py
